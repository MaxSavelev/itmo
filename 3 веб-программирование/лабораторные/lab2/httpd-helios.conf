ServerRoot "/usr/local"
DefaultRuntimeDir "/home/studs/s504890/httpd-root"
PidFile "/home/studs/s504890/httpd-root/httpd.pid"
Mutex default:/home/studs/s504890/httpd-root/mutex-dir/

Listen 7777
ServerName helios.cs.ifmo.ru:7777

LoadModule unixd_module libexec/apache24/mod_unixd.so
LoadModule authz_core_module libexec/apache24/mod_authz_core.so
LoadModule mime_module libexec/apache24/mod_mime.so
LoadModule dir_module libexec/apache24/mod_dir.so
LoadModule log_config_module libexec/apache24/mod_log_config.so
LoadModule proxy_module libexec/apache24/mod_proxy.so
LoadModule proxy_fcgi_module libexec/apache24/mod_proxy_fcgi.so

User s504890
Group studs

StartServers 1
MinSpareServers 1
MaxSpareServers 2
MaxRequestWorkers 8

TypesConfig "/usr/local/etc/apache24/mime.types"
DirectoryIndex index.html
DocumentRoot "/home/studs/s504890/httpd-root/htdocs"

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory "/home/studs/s504890/httpd-root/htdocs">
    AllowOverride None
    Options None
    Require all granted
</Directory>

ErrorLog "/home/studs/s504890/httpd-root/error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "/home/studs/s504890/httpd-root/access.log" common

ProxyRequests Off
ProxyFCGIBackendType GENERIC
ProxyPass "/check" "fcgi://127.0.0.1:17777/"
