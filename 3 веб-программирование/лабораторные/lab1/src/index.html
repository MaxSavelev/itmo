<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lab1</title>
    <style>
        body {
            isolation: isolate;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: url("../resources/background.jpeg");
            background-size: cover;
            background-position: center;
            opacity: 0.5;
        }

        body > table {
            background-color: rgba(255, 255, 255, 0.9);
        }
        table {
            border-collapse: collapse;
            margin-left: auto;
            margin-right: auto;
        }

        td {
            border: 1px solid black;
        }

        #student-header {
            font-family: fantasy;
            color: darkblue;
            font-size: 18px;
        }

        .field-error {
            color: #b00020;
            min-height: 1.2em;
            margin: 0 2px 8px;
            text-align: left;
        }

        .invalid-field,
        #y-input.invalid-field {
            border-color: #b00020;
            background-color: #fff0f0;
        }

        .button-fieldset {
            text-align: center;
        }

        .button-fieldset > legend {
            text-align: left;
        }

        #y-input,
        .x-button,
        .r-button {
            padding: 4px 12px;
            border-radius: 7px;
            display: inline-block;
            margin: 8px 2px;
        }

        #y-input {
            border: 1px solid #777777;
        }

        .x-button,
        .r-button {
            border: none;
            background-color: #eeeeee;
        }

        .x-button:hover,
        .r-button:hover {
            background-color: #d6e4ff;
            cursor: pointer;
        }

        .x-button.selected,
        .r-button.selected {
            background-color: royalblue;
            color: white;
        }

        #check-button {
            display: block;
            margin: 8px auto;
            padding: 4px 12px;
        }

        #graph {
            display: block;
            margin: 12px;
        }

        #results-table {
            width: 100%;
        }

        #clear-history-button {
            margin-bottom: 8px;
            padding: 4px 12px;
            cursor: pointer;
        }

        #results-table th,
        #results-table td {
            border: 1px solid black;
            padding: 6px;
            text-align: center;
        }

        #results-table td {
            max-width: 240px;
            overflow-wrap: anywhere;
        }

        .hit {
            color: green;
        }

        .miss {
            color: #b00020;
        }

        body {
            min-height: 100vh;
        }

        .particle {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: royalblue;
            pointer-events: none;
            z-index: 1;
        }
    </style>
    <script src="script.js" defer></script>
</head>
<body>
<table>
    <tr>
        <td colspan="2">
            <header id="student-header">
                <h1>Проверка попадания точки</h1>
                <p>Савельев Максим Сергеевич</p>
                <p>Группа: P3208</p>
                <p>Вариант: 12637</p>
            </header>
        </td>
    </tr>
    <tr>
        <td>
            <canvas id="graph" width="400" height="400">
                Для отображения графика нужен браузер с поддержкой Canvas.
            </canvas>
        </td>
        <td>
            <form id="point-form">
                <fieldset id="x-fieldset" class="button-fieldset">
                    <legend>Координата X</legend>

                    <button type="button" class="x-button" value="-3">-3</button>
                    <button type="button" class="x-button" value="-2">-2</button>
                    <button type="button" class="x-button" value="-1">-1</button>
                    <button type="button" class="x-button" value="0">0</button>
                    <button type="button" class="x-button" value="1">1</button>
                    <button type="button" class="x-button" value="2">2</button>
                    <button type="button" class="x-button" value="3">3</button>
                    <button type="button" class="x-button" value="4">4</button>
                    <button type="button" class="x-button" value="5">5</button>
                    <input type="hidden" id="x-input" name="x">
                    <p id="x-error" class="field-error"></p>
                </fieldset>

                <fieldset>
                    <legend>Координата Y</legend>
                    <label for="y-input">Введите Y строго между −3 и 3:</label>
                    <input
                            type="text"
                            id="y-input"
                            name="y"
                            placeholder="-3 < Y < 3"
                    >
                    <p id="y-error" class="field-error"></p>
                </fieldset>
                <fieldset id="r-fieldset" class="button-fieldset">
                    <legend>Радиус R</legend>
                    <button type="button" class="r-button" value="1">1</button>
                    <button type="button" class="r-button" value="2">2</button>
                    <button type="button" class="r-button" value="3">3</button>
                    <button type="button" class="r-button" value="4">4</button>
                    <button type="button" class="r-button" value="5">5</button>
                    <input type="hidden" id="r-input" name="r">
                    <p id="r-error" class="field-error"></p>
                </fieldset>
                <button type="submit" id="check-button">Проверить</button>
            </form>
        </td>
    </tr>
    <tr>
        <td colspan="2">
            <h2>Результаты</h2>
            <button type="button" id="clear-history-button">Очистить историю</button>
            <table id="results-table">
                <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th>Результат</th>
                    <th>Дата и время</th>
                </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
